<h1>unizom-insta media</h1>
<p>
  Instagramの投稿APIは、画像・動画を<strong>公開URLから取りに来る</strong>仕様のため、
  投稿前の素材をここに一時的に置いています。
</p>
<p>
  人が読むためのページではありません。unizom公式のInstagramは
  <a href="https://www.instagram.com/unizom.jp/">@unizom.jp</a> です。
</p>
<p><code>/media/&lt;投稿フォルダ名&gt;/</code> の下に、その回の素材が入ります。</p>
