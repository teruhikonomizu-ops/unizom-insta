name: publish

# 投稿は「のみさんが承認した時だけ」動く（2026-08-13 のみさん決定）。
# 定時のcronは置かない。手で起動するか、スマホのClaudeから起動する。
on:
  workflow_dispatch:
    inputs:
      pack:
        description: "投稿パック名（docs/media/ 配下のフォルダ名）"
        required: true
        type: string
      dry_run:
        description: "投稿せずコンテナ作成までで止める（動作確認用）"
        required: true
        default: true
        type: boolean
      force:
        description: "セールのお知らせの期限切れでも投稿する（のみさんが期間を確かめた時だけ）"
        required: false
        default: false
        type: boolean
# ⚠ 動画の種別を選ぶ入力は置かない。Metaは media_type=VIDEO を廃止し、
#   動画はすべてリール(REELS)扱いになったため（2026-08-13にAPIの返答で確認）。

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 2026-11-14（10/12 総点検 低）: パック名は命令文に直接埋め込まず、環境変数 PACK で受け渡す。
      #   先頭は英数字・英数字とハイフン・下線だけを通す（今までのパック名は全部この形）＝変な文字の名前で余計な命令が動かないように
      - name: パック名を確かめる
        env:
          PACK: ${{ inputs.pack }}
        run: |
          # 行ごとに見る grep だと改行入りの名前が通る＝bash の [[ =~ ]] で全体を見る（2026-11-14 別の目の点検）
          if ! [[ "$PACK" =~ ^[0-9A-Za-z][0-9A-Za-z_-]*$ ]]; then
            echo "::error::パック名に使えない文字があります（先頭は英数字・英数字とハイフン・下線だけ）"
            exit 1
          fi

      - name: 素材が公開URLから取れるか先に確かめる
        env:
          PACK: ${{ inputs.pack }}
        run: |
          base="https://teruhikonomizu-ops.github.io/unizom-insta/media/$PACK"
          fail=0
          for f in "docs/media/$PACK"/*.jpg "docs/media/$PACK"/*.mp4; do
            [ -e "$f" ] || continue
            url="$base/$(basename "$f")"
            code=$(curl -s -o /dev/null -w "%{http_code}" -L "$url")
            echo "$code  $url"
            [ "$code" = "200" ] || fail=1
          done
          if [ "$fail" = "1" ]; then
            echo "::error::公開URLから取れない素材がある。GitHub Pagesのビルド完了を待つか、ファイル名を確認する"
            exit 1
          fi

      - name: 投稿
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: "17841451592190940"
          PACK: ${{ inputs.pack }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
        run: |
          opts=""
          [ "$DRY_RUN" = "true" ] && opts="$opts --dry-run"
          [ "$FORCE" = "true" ] && opts="$opts --force"
          python3 scripts/publish_post.py "$PACK" $opts
