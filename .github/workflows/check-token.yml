name: token-check

# トークンが効いているかを確かめるだけのワークフロー。
# 手動実行のほか、毎週月曜に自動で回して「気づかないうちに切れていた」を防ぐ。
on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * 0"   # 毎週月曜 07:00 JST

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instagram APIに疎通確認
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 scripts/ig_api.py
