name: token-check

# トークンが効いているかを確かめるだけのワークフロー。
# 手動実行のほか、毎週月曜に自動で回して「気づかないうちに切れていた」を防ぐ。
on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * 0"   # 毎週月曜 07:00 JST

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instagram APIに疎通確認
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # User IDは秘密ではない（公開アカウントの識別子）ので直書きする。
          # Secretsに入れる物を減らすと、のみさんの手作業と取り違えが減る。
          IG_USER_ID: "17841451592190940"
        run: python3 scripts/ig_api.py
