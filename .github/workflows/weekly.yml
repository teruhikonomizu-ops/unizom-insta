name: weekly-build

# 毎週金曜の朝、投稿パックを1つ作る。**投稿はしない。**
# のみさんが承認して publish を動かすまで、何も公開されない。
# 🔴 2026-08-13: 定時実行は止めた。パック作りは**このPC**でやる。
#   理由: クラウドで書かせるには CLAUDE_CODE_OAUTH_TOKEN が要るが、
#   入れ直しても 401（OAuth access token is invalid）で通らなかった。
#   PCのClaude Codeは認証済みで同じコードが通しテストに成功しているため、
#   PC側（タスク インスタ_金曜のお知らせ / scripts\金曜のお知らせ.ps1）へ寄せた。
#   ここは手で動かす時のために残してある。トークンが直ったら下のcronを戻せばよい。
on:
  # schedule:
  #   - cron: "0 22 * * 4"   # 木曜22:00 UTC = 金曜07:00 JST
  workflow_dispatch:
    inputs:
      topic:
        description: "ネタのid（空なら承認済みの先頭）"
        required: false
        type: string
      test_pack:
        description: "動作確認用のパック名。入れると台帳を汚さず、コミットもしない"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Pillowを入れる
        # 2026-11-08 のみさん承認: 部品の乗っ取り（サプライチェーン攻撃）対策で版を固定
        run: pip install --quiet Pillow==12.3.0

      - name: Claude Code を入れる
        # 2026-11-08 のみさん承認: 公開から3日たった版だけ入れる（部品の乗っ取り対策）
        # 2026-11-13 改修: npm の待ち期間だけだと、版が出て3日後の約4分間「本体は入るが実行ファイルが入らない」
        #   （同日朝にラジオが落ちた原因）。本体と実行ファイルの部品の両方が3日たった版をスクリプトが選んで入れ、
        #   claude --version が通ることまで確かめる。ai-radio の scripts/install_claude_code.py と同じ物。
        run: python3 scripts/install_claude_code.py --days 3

      # 2026-11-14（10/12 総点検 低）: 手で入れる名前（test_pack・topic）は命令文に直接埋め込まず、環境変数で受け渡す。
      #   先頭は英数字・英数字とハイフン・下線だけを通す（今までのパック名・ネタのidは全部この形）
      - name: 今週のパック名を決める
        id: name
        env:
          TEST_PACK: ${{ inputs.test_pack }}
          TOPIC: ${{ inputs.topic }}
        run: |
          for v in "$TEST_PACK" "$TOPIC"; do
            if [ -n "$v" ] && ! [[ "$v" =~ ^[0-9A-Za-z][0-9A-Za-z_-]*$ ]]; then
              echo "::error::パック名・ネタのidに使えない文字があります（先頭は英数字・英数字とハイフン・下線だけ）"; exit 1
            fi
          done
          if [ -n "$TEST_PACK" ]; then
            echo "pack=$TEST_PACK" >> "$GITHUB_OUTPUT"
            echo "test=true" >> "$GITHUB_OUTPUT"
            echo "動作確認: $TEST_PACK（台帳は汚さない・コミットもしない）"
          else
            d=$(TZ=Asia/Tokyo date +%Y-%m-%d)   # 金曜の日付をパック名に使う
            echo "pack=$d-weekly" >> "$GITHUB_OUTPUT"
            echo "test=false" >> "$GITHUB_OUTPUT"
            echo "パック名: $d-weekly"
          fi

      - name: その日のパックがもうあるなら何もしない
        id: guard
        run: |
          if [ "${{ steps.name.outputs.test }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 日付で始まるフォルダが1つでもあれば作らない。
          # 「今週はこれを出す」と人が先に用意したパック（例: 2026-08-21-bag-teaser）を
          # 週次が上書き・重複させないため。名前が -weekly でなくても効くようにする。
          d=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          existing=$(ls -d docs/media/${d}-* 2>/dev/null | head -1 || true)
          if [ -n "$existing" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "その日のパックは用意済み（$existing）。二重に作らない。"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: パックを組み立てる
        if: steps.guard.outputs.skip == 'false'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 2026-11-13 鍵を持つこの手順の中で Claude Code が自分を最新版へ更新しないように止める（ai-radio と同じ）
          DISABLE_AUTOUPDATER: "1"
          TOPIC: ${{ inputs.topic }}
          PACK: ${{ steps.name.outputs.pack }}
          IS_TEST: ${{ steps.name.outputs.test }}
        run: |
          opt=""
          [ -n "$TOPIC" ] && opt="--topic $TOPIC"
          [ "$IS_TEST" = "true" ] && opt="$opt --no-ledger"
          python3 scripts/build_weekly.py "$PACK" $opt

      - name: 出来たものをコミットする
        if: steps.guard.outputs.skip == 'false' && steps.name.outputs.test == 'false'
        env:
          PACK: ${{ steps.name.outputs.pack }}
        run: |
          git config user.name "unizom-insta bot"
          git config user.email "285088708+teruhikonomizu-ops@users.noreply.github.com"   # GitHub の匿名アドレス（2026-11-11）
          git add -A
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "今週の投稿パックを作った: $PACK

          自動生成。まだ投稿していない。のみさんの承認を待つ。"
            git push
          fi

      - name: できたことを知らせる
        if: steps.guard.outputs.skip == 'false'
        env:
          PACK: ${{ steps.name.outputs.pack }}
        run: |
          echo "### 今週のインスタができました" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "パック: \`$PACK\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat "docs/media/$PACK/caption.txt" >> "$GITHUB_STEP_SUMMARY"
